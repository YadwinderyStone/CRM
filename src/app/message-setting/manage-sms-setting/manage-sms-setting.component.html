<div class="page-header-main">
    <div class="row align-items-center justify-content-between">
      <div class="col-md-auto col-sm-auto">
        <div class="content-header">
          <h1 *ngIf="!isEditMode">
            {{'ADD_EMAIL_SMTP_SETTING' | translate }}
          </h1>
          <h1 *ngIf="isEditMode">
            {{'ADD_EMAIL_SMTP_SETTING' | translate }}
          </h1>
        </div>
      </div>
    </div>
  </div>
  <form [formGroup]="smsConfigForm">
    <div class="row">
      <div class="col-md-6">
        <div class="form-group ">
          <label class="text-danger"> {{'HOST' | translate }} *</label>
          <input formControlName="host" class="form-control" type="text">
          <div *ngIf="smsConfigForm.get('host').touched && smsConfigForm.get('host').errors">
            <div class="text-danger" *ngIf="smsConfigForm.get('host').errors?.required">
              {{'HOST_IS_REQUIRED' | translate }}
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group ">
          <label class="text-danger"> {{'PORT' | translate }} *</label>
          <input formControlName="port" class="form-control" type="number">
          <div *ngIf="smsConfigForm.get('port').touched && smsConfigForm.get('port').errors">
            <div class="text-danger" *ngIf="smsConfigForm.get('port').errors?.required">
              {{'PORT_IS_REQUIRED' | translate }}
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group ">
          <label class="text-danger"> {{'USER_NAME' | translate }} *</label>
          <input formControlName="userName" class="form-control" type="text">
          <div *ngIf="smsConfigForm.get('userName').touched && smsConfigForm.get('userName').errors">
            <div class="text-danger" *ngIf="smsConfigForm.get('userName').errors?.required">
              {{'USER_NAME_IS_REQUIRED' | translate }}
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label class="text-danger"> {{'PASSWORD' | translate }} *</label>
          <input autocomplete="new-password" formControlName="password" class="form-control" type="password">
          <div *ngIf="smsConfigForm.get('password').touched && smsConfigForm.get('password').errors">
            <div class="text-danger" *ngIf="smsConfigForm.get('password').errors?.required">
              {{'PASSWORD_IS_REQUIRED' | translate }}
            </div>
          </div>
        </div>
      </div>
      <!-- <div class="form-group col-md-6 status-switch">
        <mat-slide-toggle formControlName="isEnableSSL" [dir]="langDir">
          <span *ngIf="smsConfigForm.get('isEnableSSL').value">
            {{'ENABLE_SSL' | translate }}
          </span>
          <span *ngIf="!smsConfigForm.get('isEnableSSL').value">
            {{'ENABLE_SSL' | translate }}
          </span>
        </mat-slide-toggle>
      </div> -->
      <div class="form-group col-md-6 status-switch">
        <mat-slide-toggle formControlName="isDefault">
          <span *ngIf="smsConfigForm.get('isDefault').value">
            {{'IS_DEFAULT' | translate }}
          </span>
          <span *ngIf="!smsConfigForm.get('isDefault').value">
            {{'IS_DEFAULT' | translate }}
          </span>
        </mat-slide-toggle>
      </div>
      <div class="m-top-10 col-md-12">
        <button *hasClaim="'EMAIL_MANAGE_EMAIL_SMTP_SETTINS'" class="btn btn-success btn-sm m-right-10" (click)="saveSetting()"
          cdkFocusInitial><i class="fas fa-save"></i> {{'SAVE' | translate }}</button>
        <button type="button" class="btn btn-danger btn-sm" [routerLink]="['/email-smtp']"><i
            class="fas fa-times-circle"></i>
          {{'CANCEL' | translate }}
        </button>
      </div>
    </div>
  </form>
