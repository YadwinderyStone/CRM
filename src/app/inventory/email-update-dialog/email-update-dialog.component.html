<div class="page-header-main" mat-dialog-title>
    <div class="row align-items-center justify-content-between">
        <div class="col-md-auto col-sm-auto">
            <div class="content-header">
                <h1>{{'Update Email' | translate }}</h1>
            </div>
        </div>
    </div>
</div>
<div class="loading-shade" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
</div>
<mat-dialog-content class="main">
    <div class="scrollbar-example">
        <form [formGroup]="emailForm">
            <div class="row">
                <div class="col-md-12 pb-1">
                    <div class="form-group">
                        <mat-label>Mobile No.</mat-label>
                        <!-- <input type="text"  formControlName="mobileNo"  class="form-control"> -->
                        <input type="text" formControlName="mobileNo"  class="form-control">
                        <mat-error *ngIf="emailForm.get('mobileNo')?.touched && emailForm.get('mobileNo')?.errors?.required">Please enter mobile no.</mat-error>
                    </div>
                </div>
                <div class="col-md-12 pb-1">
                    <div class="form-group">
                        <mat-label>Email Id</mat-label>
                        <!-- <input type="text"  formControlName="mobileNo"  class="form-control"> -->
                        <input type="text"formControlName="emailId" class="form-control">
                        <mat-error *ngIf="emailForm.get('emailId')?.touched && emailForm.get('emailId')?.errors?.required" >Please enter email</mat-error>
                        <mat-error *ngIf="emailForm.get('emailId')?.touched && emailForm.get('emailId')?.errors?.email" >Please enter valid email</mat-error>
                    </div>
                </div>
            </div>
        </form>
    </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <div class="col-md-12 mt-1" *hasClaim="'INT_EMAIL_UPDATE_INTERACTION'">
        <button (click)="update()" type="button" class="btn btn-success">
            <i class="fas fa-paper-plane"></i>
            {{'Update' | translate }}
        </button>
        <button type="button" class="btn btn-danger btn-md mx-2" (click)="dialogRef.close(false);"><i
                class="fas fa-times-circle"></i>
            {{"Back" | translate}}
        </button>
    </div>
</mat-dialog-actions>
